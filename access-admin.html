<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>StockZone | 授權管理</title><style>*,*:before,*:after{box-sizing:border-box}body{margin:0;background:#0e1420;color:#edf4ff;font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.panel{width:min(100%,520px);background:#192437;border:1px solid #33455b;border-radius:18px;padding:28px;box-shadow:0 14px 44px #0006}h1{margin:0 0 8px;letter-spacing:.4px;font-size:25px}p{line-height:1.8;color:#aebed3;font-size:14px;margin:8px 0 16px}button{padding:12px 15px;border-radius:9px;border:0;background:#75b6ed;color:#0c2036;font-size:14px;font-weight:700;cursor:pointer}button.secondary{background:#344760;color:#fff}button.danger{background:#d06672;color:white}button:disabled{opacity:.5;cursor:wait}input{width:100%;background:#101a2b;border:1px solid #3b516d;color:#eef5ff;border-radius:8px;padding:11px;font-size:14px;margin:7px 0 14px}small{color:#a1b0c5;display:block;font-size:12px;line-height:1.7}.error{color:#ffa4ac}.success{color:#8bd1b9}.line{border-top:1px solid #33455b;padding-top:15px;margin-top:18px}.actions{display:flex;gap:10px;flex-wrap:wrap}.item{padding:12px 0;border-top:1px solid #344760;display:flex;align-items:center;justify-content:space-between;gap:10px}.item .muted{font-size:12px;color:#91a7c4}.item button{padding:8px 10px}.hidden{display:none}</style></head><body><main class="panel"><h1>StockZone 授權管理</h1><p>僅管理員可發送專屬連結、撤銷裝置。</p><section id="login"><label>管理員啟用密鑰（Vercel 環境變數設定）<input type="password" autocomplete="off" id="secret" placeholder="輸入管理員密鑰"></label><div class="actions"><button id="signIn">驗證管理員</button><a href="/" style="color:#80c7ef;margin:auto 0">返回網站</a></div></section><section id="admin" class="hidden"><div class="line"><label>授權備註（例如朋友 A／手機）<input maxlength="80" id="label" placeholder="例：朋友 A 的手機"></label><label>連結有效時間（小時）<input id="hours" type="number" min="1" max="168" value="48"></label><button id="make">產生一次性專屬連結</button><div id="issued" class="hidden"><p class="success">連結只會在此顯示一次，請立即複製傳送給指定使用者。</p><input readonly id="link"><div class="actions"><button id="copy">複製連結</button></div></div></div><div class="line"><div class="actions"><button class="secondary" id="refresh">重新整理授權清單</button><button class="danger" id="signOut">登出此裝置</button></div><h3>已發送的邀請</h3><div id="invites"></div><h3>裝置授權</h3><div id="sessions"></div></div></section><p id="msg"></p><small>撤銷權限會使該裝置下次存取時被拒絕。所有授權狀態保存在 Neon，不受 Vercel 再部署影響。</small></main><script>
const $=id=>document.getElementById(id),msg=$('msg');let ownSessionId='';
async function api(body){const r=await fetch('/api/access',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json','X-StockZone-Access':'1'},body:JSON.stringify(body)});return {http:r.status,...await r.json()}}
async function get(action){const r=await fetch('/api/access?action='+action,{cache:'no-store'});return r.json()}
function notify(s,bad=false){msg.textContent=s;msg.className=bad?'error':'success'}
async function showAdmin(){const state=await get('status');ownSessionId=state.sessionId||'';$('login').classList.add('hidden');$('admin').classList.remove('hidden');refresh()}
function stateName(x){return x.revoked_at?'已撤銷':x.used_at?'已使用':new Date(x.expires_at)<new Date()?'已過期':'待使用'}
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);return n}
async function refresh(){try{const data=await get('list');if(!data.ok)throw Error(data.error);const invites=$('invites'),sessions=$('sessions');invites.replaceChildren();sessions.replaceChildren();
 for(const it of data.invites){const row=el('div');row.className='item';const side=el('div');side.append(el('div',it.label),el('div',stateName(it)+' | 到期 '+new Date(it.expires_at).toLocaleString('zh-TW')));side.lastChild.className='muted';row.append(side);if(!it.revoked_at){const b=el('button','撤銷');b.className='danger';b.onclick=async()=>{if(!confirm('撤銷此邀請及全部相關裝置授權？'))return;await api({action:'revoke-invite',id:it.id});refresh()};row.append(b)}invites.append(row)}
 for(const s of data.sessions){const row=el('div');row.className='item';const side=el('div');side.append(el('div',s.label+'（'+s.role+'）'),el('div',(s.revoked_at?'已撤銷':'到期 '+new Date(s.expires_at).toLocaleString('zh-TW'))+' | '+s.sessionId));side.lastChild.className='muted';row.append(side);if(!s.revoked_at&&s.sessionId!==ownSessionId){const b=el('button','停用裝置');b.className='danger';b.onclick=async()=>{if(!confirm('確認停用此裝置？'))return;await api({action:'revoke-device',sessionId:s.sessionId});refresh()};row.append(b)}sessions.append(row)}
 }catch(e){notify('載入失敗：'+e.message,true)}}
$('signIn').onclick=async()=>{try{const secret=$('secret').value;const r=await api({action:'admin-login',secret});$('secret').value='';if(!r.ok)throw Error('管理密鑰不正確或授權資料表尚未建立');showAdmin()}catch(e){notify(e.message,true)}};
$('make').onclick=async()=>{try{const r=await api({action:'invite',label:$('label').value,hours:Number($('hours').value)});if(!r.ok)throw Error(r.error);$('link').value=location.origin+r.path;$('issued').classList.remove('hidden');notify('專屬連結已產生');refresh()}catch(e){notify('無法產生連結：'+e.message,true)}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('link').value);notify('已複製連結')}catch{ $('link').focus();$('link').select();notify('請手動複製選取的連結')}};
$('refresh').onclick=refresh;
$('signOut').onclick=async()=>{await api({action:'signout'});location.reload()};
(async()=>{try{const status=await get('status');if(status.authorized&&status.role==='admin')showAdmin()}catch(e){notify('無法查詢授權狀態',true)}})();
</script></body></html>
