<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>台股目標價提醒</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>台股目標價提醒</h1>
      <p>
        股價來源：Yahoo Finance｜目標價來源：公開財經新聞
      </p>
    </header>

    <section class="panel">
      <label for="stockCode">股票代碼</label>

      <div class="search-row">
        <input
          id="stockCode"
          inputmode="numeric"
          maxlength="6"
          placeholder="例如 2454"
        >
        <button id="searchButton">搜尋</button>
      </div>

      <div class="quick-list">
        <button data-code="2454">聯發科</button>
        <button data-code="3017">奇鋐</button>
        <button data-code="6187">萬潤</button>
        <button data-code="7769">鴻勁</button>
        <button data-code="2467">志聖</button>
        <button data-code="4919">新唐</button>
        <button data-code="8064">東捷</button>
      </div>

      <p id="statusText" class="status">尚未查詢</p>
    </section>

    <section id="searchResult" class="panel hidden"></section>

    <section class="panel">
      <div class="section-title">
        <h2>我的清單</h2>
        <button id="refreshAllButton">
          全部刷新
        </button>
      </div>

      <div class="tabs">
        <button
          class="tab active"
          data-tab="holdings"
        >
          持股清單
        </button>

        <button
          class="tab"
          data-tab="watchlist"
        >
          觀察清單
        </button>
      </div>

      <div id="stockList"></div>
    </section>

    <footer>
      <p>
        按「全部刷新」時，會同步更新持股清單與觀察清單的股價及可取得的目標價。
      </p>
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
